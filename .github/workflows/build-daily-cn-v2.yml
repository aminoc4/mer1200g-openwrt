name: Build MER1200G daily-cn-v2 firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-pip \
            python3-setuptools rsync swig unzip zlib1g-dev file wget ca-certificates
          python3 -m pip install --break-system-packages pyelftools

      - name: Download pinned source archives
        run: |
          mkdir -p archives
          python3 - <<'PYEOF'
          import hashlib, json, pathlib, urllib.request
          spec = json.loads(pathlib.Path('variants/daily-cn-v2/sources.lock.json').read_text())
          for s in spec:
              print('downloading', s['name'], s['url'], flush=True)
              dest = pathlib.Path('archives') / s['file']
              with urllib.request.urlopen(s['url'], timeout=600) as r, dest.open('wb') as f:
                  while True:
                      chunk = r.read(1024 * 1024)
                      if not chunk:
                          break
                      f.write(chunk)
              digest = hashlib.sha256(dest.read_bytes()).hexdigest()
              assert digest == s['sha256'], (s['name'], digest, s['sha256'])
              print('verified', s['name'], digest, flush=True)
          PYEOF

      - name: Prepare build tree
        run: python3 variants/daily-cn-v2/tools/prepare.py archives build

      - name: Build firmware
        run: BUILD_ROOT="$PWD/build" JOBS=2 sh variants/daily-cn-v2/build.sh

      - name: Package review artifacts
        run: python3 variants/daily-cn-v2/tools/package-review.py build output

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-cn-v2-firmware
          path: |
            output/*
            build/bin/targets/ramips/mt7620/*sysupgrade.bin
          if-no-files-found: warn
          retention-days: 30
